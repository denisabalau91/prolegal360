server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Los assets de Next llevan hash en el nombre: cache inmutable.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # trailingSlash: true → cada ruta es un directorio con su index.html.
    location / {
        try_files $uri $uri/ =404;
    }
}
